name: CI Smoke Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          # Install the pinned CPU build first so requirements.txt does not pull the multi-GB CUDA wheel
          pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
          pip install pytest

      # Fine-tuned weights are not committed, so model-dependent probes are skipped here;
      # proxy logic is exercised with a deterministic stub classifier.
      - name: Run Smoke Tests
        run: |
          python -m pytest tests/ -v -rs
